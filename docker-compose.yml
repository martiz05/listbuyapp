services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: buyapp
      POSTGRES_USER: buyapp
      POSTGRES_PASSWORD: ${BUYAPP_POSTGRES_PASSWORD:?Set BUYAPP_POSTGRES_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    volumes:
      - buyapp-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyapp -d buyapp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  buyapp-postgres-data:
